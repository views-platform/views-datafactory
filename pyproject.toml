[project]
name = "views-datafactory"
version = "0.1.0"
description = "Data factory for the VIEWS conflict forecasting platform — harvesting, grid construction, compilation, and synthetic generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "requests>=2.28,<3",
    "pyarrow>=14,<20",
    "pyshp>=2.3,<3",
    "matplotlib>=3.7,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.4,<1",
    "mypy>=1.8,<2",
    "types-requests>=2.28,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/datafactory_provenance",
    "src/datafactory_priogrid",
    "src/datafactory_harvester",
    "src/datafactory_compilation",
    "src/datafactory_synthetic",
]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

[tool.mypy]
strict = true
ignore_missing_imports = true
# numpy's ndarray is generic but parameterising it everywhere is noisy
# and deviates from community convention.
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "network: tests that require network access (deselected by default)",
]
