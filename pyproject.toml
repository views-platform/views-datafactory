[project]
name = "views-datafactory"
version = "1.11.0"
description = "Data factory for the VIEWS conflict forecasting platform — provenance, harvesting, consolidation, viewpoint construction, compilation, and assembly."
authors = [
    { name = "Simon Polichinel von der Maase", email = "simmaa@prio.org" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Lowered 3.12 -> 3.11 on 2026-08-13 (#443). ADR-030 set >=3.12 because
# "tifffile's current releases require it" — a fact about a vendor at a
# moment, not an architectural need; 3.11 was never considered there.
# The consumer that forced the question: the views-models conda envs run
# 3.11.14/3.11.15, so 28 requirements files could not install this at all.
# COST, and it is real: the lock now forks. Under 3.11 the raster stack
# resolves tifffile 2026.3.3 / imagecodecs 2026.3.6; under >=3.12 it stays
# 2026.5.15 / 2026.5.10. Both upstreams dropped 3.11 permanently (tifffile
# uses PEP 695 from 2026.4.11 and would SyntaxError; imagecodecs ships
# cp312-abi3 only from 2026.5.10). See the ADR-030 amendment and C-347.
requires-python = ">=3.11"
keywords = ["conflict-forecasting", "priogrid", "ucdp", "acled", "data-pipeline", "provenance", "zarr"]
# License is declared via the SPDX `license` expression above (PEP 639); the deprecated
# `License ::` classifier is intentionally omitted to avoid the expression/classifier clash.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26,<3",
    "requests>=2.28,<3",
    "pyarrow>=14,<20",
    "pyshp>=2.3,<3",
    # DO NOT REMOVE without checking views-hydranet#215 first. Nothing under
    # src/ imports matplotlib — only unpackaged scripts/ do — so demoting it
    # looks free. It is not: views-hydranet imports matplotlib at module level
    # on its model-run path and does not declare it, and four views-models
    # environments pin hydranet + this package together, so matplotlib reaches
    # them through us. Removing it breaks clean builds while leaving upgraded
    # local envs green (pip never prunes orphaned transitive deps). Drop this
    # line only once hydranet declares matplotlib itself. See C-334.
    "matplotlib>=3.8,<4",
    "shapely>=2.0,<3",
    "xarray>=2024.1,<2026",
    "zarr>=2.16,<3",
    "fsspec>=2023.9,<2025",
    "aiohttp>=3.9,<4",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
    # Floor RAISED to 1.10.2 on 2026-08-02, and the reason is not our own
    # imports — it is which version we permit into a shared environment.
    #
    # views-frames changed how the summary statistics are COMPUTED, three
    # times, none of it labelled breaking because it shipped MINOR:
    #   1.2.0  outside-in HDI tower + mass-aware tip ("fixes a silent" error)
    #   1.3.0  no magnitude-based zeroing by default (tower_point/hdi_tower/
    #          summarize_tower)
    #   1.9.0  tower-tip MAP: tip_mass 0.5 -> 0.25. Their words: "Behavior
    #          change to tower_point/summarize_tower outputs, shipped MINOR."
    #
    # A floor of >=1.0 therefore permits three different MAP/HDI semantics.
    # views_frames_summarize ships in the same wheel as views_frames, so any
    # environment resolving against our floor can get old estimator
    # behaviour, and two systems on different versions produce different
    # numbers from the same posterior — silently.
    #
    # The first audit of this floor got it wrong by asking only "what does
    # this package import?" By that test 1.0.0 passes, because we import
    # four symbols and none of them are estimators. But a floor constrains
    # the resolver, not our import list, and we are a widely-installed
    # package: if we are the loosest constraint we are the one letting the
    # old semantics in. Recorded as C-337.
    #
    # 1.9.0 is the strict minimum. 1.10.2 is chosen because 1.10.1/1.10.2 are
    # documentation and test releases that cost consumers nothing, and a
    # floor meaning "current" stays honest more easily than one meaning "the
    # oldest version that happens to work".
    "views-frames>=1.10.2,<2",
]

# pandas is a LEGACY output format, never a foundational import.
# Across views_platform pandas is being phased out (views-pipeline-core
# declares polars and guards its import graph; views-frames is numpy-only),
# so a library that *requires* pandas forces every consumer to negotiate a
# version it may not want. Here it gates one thing only: the DataFrame and
# country-month output formats. The range stays deliberately wide —
# libraries declare widely or not at all; environments pin.
# Guarded by tests/test_import_purity.py.
#
# Honest caveat (2026-07-31): this extra gates NOTHING today. xarray is a
# required dependency and xarray requires pandas, so no installable
# configuration of this package lacks pandas — verified per-package in a
# clean venv (xarray is the sole carrier; zarr, fsspec, pyarrow, shapely,
# tifffile, imagecodecs, views-frames, pyshp, requests, aiohttp are clean).
# The declaration is preparation for #381, which asks whether the remote
# zarr reader can drop xarray. Until then this makes pandas *not imported*,
# not *not installed*.
#
# Deliberately UNCAPPED. A `<3` bound here would bind only opt-in users
# while xarray — the actual carrier — is unconstrained, so it would
# generate conflicts without preventing pandas 3. Backed by evidence, not
# preference: the full suite is run under pandas 3 (see #378).
[project.optional-dependencies]
pandas = ["pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/views-platform/views-datafactory"
Repository = "https://github.com/views-platform/views-datafactory"
Issues = "https://github.com/views-platform/views-datafactory/issues"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.4,<1",
    "mypy>=1.8,<2",
    "types-requests>=2.28,<3",
    # pandas backs the [pandas] extra above, but scripts/ and tests/ need it
    # unconditionally, so it is a dev dependency too.
    "pandas>=2.0,<3",
    # tests/test_ci_gates.py asserts the STRUCTURE of the GitHub workflows —
    # that `uv lock --check` precedes `uv sync`, and that the local-ref step
    # precedes the deploy gates. Both orderings fail GREEN when wrong, so they
    # are asserted rather than trusted. Dev-only: nothing under src/ imports it.
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/datafactory_provenance",
    "src/datafactory_priogrid",
    "src/datafactory_harvester",
    "src/datafactory_http",
    "src/datafactory_compilation",
    "src/datafactory_consolidation",
    "src/datafactory_viewpoint",
    "src/datafactory_adapters",
    "src/datafactory_query",
]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["UP046"]

[tool.mypy]
strict = true
ignore_missing_imports = true
# Check against the DECLARED FLOOR, not whatever interpreter happens to be
# running. Without this mypy uses the running one — 3.13 in the dev venv —
# so a 3.12-only annotation would pass locally and fail only in CI. Ruff's
# target-version already does the analogous job for lint. Keep both equal to
# requires-python; tests/test_ci_gates.py asserts CI's pins match it too.
python_version = "3.11"

# tifffile is EXCLUDED from analysis, and the reason is the fork itself.
# Pinning python_version to the floor makes mypy parse third-party source at
# 3.11 too — and on a 3.12+ interpreter the installed tifffile is 2026.5.15,
# which uses PEP 695 `type` statements. mypy then dies on ITS source, not
# ours: "tifffile.py:929: Type statement is only supported in Python 3.12
# and greater". Under 3.11 the env holds tifffile 2026.3.3, which predates
# PEP 695, so the same command passes — the failure appears only on the
# interpreter developers actually use.
#
# Found by running mypy at both ends rather than one (#443). Skipping the
# import is right regardless: we type-check our code, not tifffile's, and
# `read_geotiff` is the single narrow surface that touches it. Do not
# "fix" this by dropping python_version — that would silence the floor
# check everywhere to work around one third-party file.
# numpy's ndarray is generic but parameterising it everywhere is noisy
# and deviates from community convention.
disallow_any_generics = false

# MUST stay the last thing in the mypy section. A `[[tool.mypy.overrides]]`
# table ends `[tool.mypy]`, so any plain key written after it silently
# becomes an override key instead of a global one. Placed mid-section while
# writing #443, this swallowed `disallow_any_generics = false` and mypy went
# from clean to 98 errors — a config file that parsed perfectly and meant
# something else.
[[tool.mypy.overrides]]
module = ["tifffile", "tifffile.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "falsification: empirical data finding — skipped unless --run-falsification is passed",
    "consumer: purple_alien parity tests — skipped unless --run-consumer is passed",
    "slow: performance tests — runs in normal suite, use -m slow to run only these",
    "synthetic: end-to-end pipeline test on synthetic data with known-answer values",
]
