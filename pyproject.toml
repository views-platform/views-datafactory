[project]
name = "views-datafactory"
version = "1.2.11"
description = "Data factory for the VIEWS conflict forecasting platform — harvesting, grid construction, compilation, and synthetic generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "requests>=2.28,<3",
    "pyarrow>=14,<20",
    "pyshp>=2.3,<3",
    "matplotlib>=3.7,<4",
    "pandas>=1.3,<3",
    "shapely>=2.0,<3",
    "xarray>=2024.1,<2026",
    "zarr>=2.16,<3",
    "fsspec>=2023.9,<2025",
    "aiohttp>=3.9,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.4,<1",
    "mypy>=1.8,<2",
    "types-requests>=2.28,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/datafactory_provenance",
    "src/datafactory_priogrid",
    "src/datafactory_harvester",
    "src/datafactory_http",
    "src/datafactory_compilation",
    "src/datafactory_consolidation",
    "src/datafactory_viewpoint",
    "src/datafactory_synthetic",
    "src/datafactory_adapters",
    "src/datafactory_query",
]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

[tool.mypy]
strict = true
ignore_missing_imports = true
# numpy's ndarray is generic but parameterising it everywhere is noisy
# and deviates from community convention.
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "falsification: empirical data finding — skipped unless --run-falsification is passed",
    "consumer: purple_alien parity tests — skipped unless --run-consumer is passed",
    "slow: performance tests — runs in normal suite, use -m slow to run only these",
]
