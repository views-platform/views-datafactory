name: Release hygiene

# Runs the deploy gates somewhere other than one operator's laptop (C-341),
# and reports out-of-band.
#
# Renamed from "Release topology" 2026-08-11 (#424). The filename is kept so
# run history, the tracking issue's provenance links and the citations in
# publishing_to_pypi.md and the register stay valid; only the remit widened.
#
# WHY THIS EXISTS
# Promoting development -> main goes through a pull request (branch protection
# allows nothing else), and a PR merge cannot fast-forward. Merge-commit is the
# only method that preserves the release SHAs, so every release leaves exactly
# one commit on main that development has not seen. The back-merge
# (publishing_to_pypi.md §C.5) heals it. Skipping it lets the branches drift
# further after each release, until `git log main..development` counts work
# that already shipped.
#
# The deploy-gate tests have always asserted this, but they could only run
# locally: the default CI checkout is shallow, so `git merge-base` cannot
# answer and they skip (C-320). Detection therefore depended on a human running
# the full suite at the right moment. After v1.10.0 that happened four hours
# late, by accident, and it had been silently true after every prior release.
#
# WHY IT IS NOT IN THE PR TEST JOB
# Deliberate. Between a release and its back-merge the branches ARE diverged —
# correctly so. Gating pull requests on it would make every PR red during that
# window for reasons unrelated to the change under review. That is exactly
# C-320: a permanently-red CI stops carrying information. Same reasoning as
# ADR-051, which chose out-of-band alerting over a merge-blocking tripwire.
#
# WHY IT OPENS AN ISSUE RATHER THAN A PR
# Actions cannot create pull requests in this repo
# (`can_approve_pull_request_reviews: false`). The alternative — a stored PAT —
# was rejected: it adds a credential with a rotation burden, days after a
# sprint spent removing exactly that (ADR-026, C-324). `issues: write` needs no
# settings change and no secret.

on:
  release:
    types: [published]
  schedule:
    # 06:00 UTC daily. Divergence is not urgent — it is a bookkeeping error,
    # not an outage — but it should not survive a working day unnoticed.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # `pull-requests: read` is load-bearing, not tidiness. Once a `permissions:`
  # block exists, every scope NOT listed is set to `none` — so omitting this
  # revokes it. The orphan detector below is built entirely on `gh pr list`,
  # and its calls are written `... 2>/dev/null) || continue`, which makes a
  # 403 indistinguishable from "no PR found": every branch would be skipped
  # and the step would report "No orphaned branches" forever, green, on a
  # daily cron. It was nearly shipped that way — the drill that verified the
  # detector ran under the operator's own `gh` credentials, which carry full
  # scope, so it could not have caught this (C-347).
  pull-requests: read

concurrency:
  group: release-topology
  cancel-in-progress: false

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # The whole point. With the default depth-1 checkout `git merge-base`
          # cannot answer and the gate skips itself into uselessness.
          fetch-depth: 0

      - name: Fetch both long-lived branches
        run: |
          git fetch --quiet origin main development

      - name: Create local main/development refs
        # Not cosmetic. `actions/checkout` leaves exactly ONE local branch, so
        # the pytest gates' bare `git merge-base --is-ancestor main development`
        # exits 128 (ref missing) and they skip themselves — even at
        # fetch-depth: 0. Measured, not assumed: rc=128 in a simulated runner
        # checkout. Two real assertions were being skipped for want of these
        # two lines, one of which (conflict-free back-merge) the shell check
        # below does not perform at all.
        run: |
          git branch -f main origin/main
          git branch -f development origin/development

      - name: Check main is an ancestor of development
        id: check
        run: |
          if git merge-base --is-ancestor origin/main origin/development; then
            echo "diverged=false" >> "$GITHUB_OUTPUT"
            echo "main is an ancestor of development — topology is clean."
          else
            echo "diverged=true" >> "$GITHUB_OUTPUT"
            {
              echo "commits=$(git rev-list --count origin/development..origin/main)"
              echo "shas<<EOF"
              git log --oneline origin/development..origin/main
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "main is NOT an ancestor of development."
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4 — pinned, NOT upgraded

      - name: Install dependencies
        run: uv sync

      - name: Run the deploy gates that can answer here
        id: gates
        continue-on-error: true
        env:
          # Lets TestF6IssueHygiene query the issue tracker instead of
          # skipping. Without it the gate reports on nothing.
          GH_TOKEN: ${{ github.token }}
          # Tells TestF8StaleBranches' LOCAL half to skip rather than pass
          # trivially — a fresh runner has one local branch, so it would
          # otherwise claim coverage it does not have.
          # Redundant — Actions already exports CI=true — but explicit so
          # the dependency is visible: TestF8StaleBranches reads it.
          CI: "true"
        run: |
          set -o pipefail
          uv run pytest -rs \
            tests/test_falsification_deploy_v160.py::TestF8StaleBranches \
            tests/test_falsification_deploy_v160.py::TestF6IssueHygiene \
            tests/test_falsification_deploy_v160.py::TestF2ReleaseTopology \
            tests/test_falsification_deploy_v160_r2.py::TestDF1MergeTopology \
            2>&1 | tee gates.log
        # NOTE on what is deliberately NOT here:
        #   TestF1VersionBumped is xfail — it cannot fail a suite, so running
        #   it would add a green tick and no information. #425 owns that.
        #   TestF7ProductPlanCurrency reads only files and already runs in the
        #   normal PR suite; it needs no scheduled runner.

      - name: Look for work orphaned on a merged branch
        id: orphans
        # C-340 mechanism 2. A PR auto-merges the instant CI goes green; a
        # follow-up commit is then pushed to a branch that no longer has an
        # open PR, and the work is simply not on the base branch. `git push`
        # reports success. It happened on #416 and again on #437.
        #
        # THIS IS DETECTION, NOT PREVENTION, AND THAT IS DELIBERATE.
        # Four versions of a client-side pre-push hook were written and all
        # four were defeated by a different property of the environment: it
        # checked the wrong branch; it refused branch names that had been
        # reused; `git merge-base --is-ancestor` cannot distinguish reuse
        # because a merge-commit merge puts the head into the base branch
        # forever; and `remote_sha` is 0000... because delete_branch_on_merge
        # removes the branch before the next push. A client-side check is
        # racing GitHub's asynchronous branch deletion — a property of the
        # system, not a bug to iterate out.
        #
        # The orphaned STATE, by contrast, is unambiguous once things have
        # settled: a remote branch carrying commits BEYOND its merged PR's
        # head, with no open PR. No merge-method dependence, no client
        # dependencies, nothing to install, and it cannot block anyone's work.
        #
        # This step needs `pull-requests: read` — see the permissions block.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # Capture and check, rather than iterating the substitution directly.
          # `for x in $(cmd)` swallows a failure of `cmd` completely: GitHub
          # runs `bash -e {0}` and `set -uo pipefail` does NOT remove `-e`, but
          # a failing command substitution in a `for` word list is exempt from
          # it. Verified: `bash -e -c 'for x in $(false | sed s/a/b/); do echo
          # BODY; done; echo END'` prints only END. One transient `ls-remote`
          # failure would give an empty loop and a confident "No orphaned
          # branches" — the exact shape this step exists to detect (C-347).
          branches=$(git ls-remote --heads origin | sed 's|.*refs/heads/||') || {
            echo "::error::git ls-remote failed — cannot enumerate branches."
            exit 1
          }
          # A repository always has at least `main` and `development`. Empty
          # here means the command succeeded and told us nothing, which is not
          # the same as "no branches" and must not read as a clean result.
          [ -n "$branches" ] || {
            echo "::error::git ls-remote returned no branches at all."
            exit 1
          }

          # "Could not answer for this branch" is NOT "this branch is fine".
          # Every `|| continue` below is a place where a rate limit, a 502 or a
          # branch deleted mid-loop silently removes a branch from the check —
          # and if enough of them fire, the step reports a confident all-clear
          # having observed nothing. That is C-347 one level down, so the
          # skips are counted and the result is qualified by the count. The
          # abandoned hook's own rule was "skip where the environment cannot
          # answer, AND SAY WHY"; saying why is the half that is easy to drop.
          found=""
          answered=0
          unanswered=0
          for branch in $branches; do
            case "$branch" in main|development) continue ;; esac

            # A branch deleted between `ls-remote` and here is a benign race,
            # not an outage — but it is still a branch we did not check.
            git fetch --quiet origin "$branch" 2>/dev/null || { unanswered=$((unanswered + 1)); continue; }
            tip=$(git rev-parse FETCH_HEAD 2>/dev/null) || { unanswered=$((unanswered + 1)); continue; }

            # Already in development: nothing is stranded. A definite answer.
            git merge-base --is-ancestor "$tip" origin/development 2>/dev/null && { answered=$((answered + 1)); continue; }

            # An open PR means the work has a route to the base branch. This
            # is the whole reason the check is safe: a branch waiting for
            # review is indistinguishable from an orphan by SHAs alone, and
            # only the PR state separates them.
            open=$(gh pr list --head "$branch" --state open --json number \
                     --jq '.[0].number // empty' 2>/dev/null) || { unanswered=$((unanswered + 1)); continue; }
            [ -n "$open" ] && { answered=$((answered + 1)); continue; }

            # No open PR and not in development. If a PR for this branch has
            # merged, the branch outlived it — that is the #416 shape.
            pr=$(gh pr list --head "$branch" --state merged \
                   --json number,headRefOid --limit 1 2>/dev/null) || { unanswered=$((unanswered + 1)); continue; }
            merged=$(printf '%s' "$pr" | sed -n 's/.*"number":\([0-9]*\).*/\1/p')
            merged_head=$(printf '%s' "$pr" | sed -n 's/.*"headRefOid":"\([^"]*\)".*/\1/p')
            # No merged PR for this name is a real answer, not a failure.
            [ -n "$merged" ] && [ -n "$merged_head" ] || { answered=$((answered + 1)); continue; }

            # The branch sitting EXACTLY on the merged head is the normal
            # post-merge state, briefly, before delete_branch_on_merge removes
            # it. Nothing is stranded there.
            [ "$tip" = "$merged_head" ] && { answered=$((answered + 1)); continue; }

            # BRANCH NAMES ARE REUSED HERE, and matching a merged PR by name
            # alone is exactly the property that defeated hook v1. Verified:
            # `chore/version-bump-1.2.13`, `docs/roadmap-plan-v11` and
            # `feat/acled-phase2` have each headed more than one PR. A brand
            # new branch on a reused name, pushed before its PR is opened,
            # matches the OLD merged PR — and since that PR's head is not in
            # the new branch's ancestry, `git rev-list` errors out, which the
            # first version reported as "? commit(s)" rather than skipping.
            #
            # So require the merged head to be a genuine ancestor: this branch
            # must be a CONTINUATION of that pull request, not a namesake.
            git merge-base --is-ancestor "$merged_head" "$tip" 2>/dev/null || { answered=$((answered + 1)); continue; }

            # `--not origin/development` because a reused name whose old PR was
            # merged with a MERGE COMMIT still passes the ancestry test — that
            # head is in `development` forever, so it is an ancestor of every
            # branch cut afterwards (this is what defeated hook v2). Excluding
            # what is already on `development` leaves only commits that went
            # nowhere. All of this repo's recent merges are squashes, for which
            # the ancestry test alone is sufficient; this covers the pre-#54 era.
            stranded=$(git rev-list --count "${merged_head}..${tip}" --not origin/development 2>/dev/null) || { unanswered=$((unanswered + 1)); continue; }
            answered=$((answered + 1))
            [ "$stranded" = "0" ] && continue
            found="${found}
          - \`${branch}\` — ${stranded} commit(s) pushed AFTER PR #${merged} merged, no open PR"
          done

          echo "Checked ${answered} branch(es); ${unanswered} could not be answered for."

          # Answering for NOTHING while reporting clean is the defect itself,
          # not a degraded mode of it. If every branch we attempted failed, the
          # environment is broken (revoked scope, rate limit, network) and the
          # only honest output is a red run.
          if [ "$answered" -eq 0 ] && [ "$unanswered" -gt 0 ]; then
            echo "::error::Could not answer for any of ${unanswered} branch(es) — reporting clean here would assert nothing."
            exit 1
          fi

          # Some answered, some not: report what was found, but never let the
          # all-clear read as unqualified.
          if [ "$unanswered" -gt 0 ]; then
            echo "::warning::${unanswered} branch(es) could not be checked; this result is partial."
          fi

          if [ -n "$found" ]; then
            echo "orphans=true" >> "$GITHUB_OUTPUT"
            DELIM="ORPHANS_$(openssl rand -hex 8)"
            {
              echo "list<<${DELIM}"
              printf '%s\n' "$found"
              echo "${DELIM}"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::Work appears orphaned on a merged branch."
          else
            echo "orphans=false" >> "$GITHUB_OUTPUT"
            if [ "$unanswered" -gt 0 ]; then
              echo "No orphaned branches among the ${answered} checked."
            else
              echo "No orphaned branches."
            fi
          fi

      - name: Summarise the gate result
        id: gateresult
        run: |
          # `outcome`, NOT `conclusion`. With continue-on-error: true,
          # `conclusion` is forced to 'success' whatever pytest did, so a
          # failing suite would report clean — the exact defect C-345 is
          # about, one field name away.
          if [ "${{ steps.gates.outcome }}" = "failure" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            # Random delimiter: a fixed one can be forged by any content
            # containing that word on a line of its own, which would break
            # out of the output block. pytest output carries no structural
            # guarantee against it, unlike `git log --oneline` below.
            DELIM="GATELOG_$(openssl rand -hex 8)"
            {
              echo "log<<${DELIM}"
              tail -40 gates.log || true
              echo "${DELIM}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the tracking issue
        if: steps.check.outputs.diverged == 'true' || steps.gateresult.outputs.failed == 'true' || steps.orphans.outputs.orphans == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ORPHANS: ${{ steps.orphans.outputs.orphans }}
          ORPHAN_LIST: ${{ steps.orphans.outputs.list }}
          DIVERGED: ${{ steps.check.outputs.diverged }}
          COMMITS: ${{ steps.check.outputs.commits }}
          SHAS: ${{ steps.check.outputs.shas }}
          GATES_FAILED: ${{ steps.gateresult.outputs.failed }}
          GATES_LOG: ${{ steps.gateresult.outputs.log }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TOPOLOGY_SECTION=""
          if [ "$DIVERGED" = "true" ]; then
            TOPOLOGY_SECTION=$(cat <<TOPO
          ## main and development have diverged

          \`main\` is not an ancestor of \`development\`: **${COMMITS} commit(s)** on \`main\` are
          missing from \`development\`.

          \`\`\`
          ${SHAS}
          \`\`\`

          Fix with the back-merge, as a **merge commit** — never a squash, which creates yet another
          commit that is not \`main\`, so this would reopen:

          \`\`\`bash
          gh pr create --base development --head main --title "chore: sync main back into development"
          \`\`\`

          Every release promotion leaves one merge commit on \`main\` that \`development\` has not
          seen. Expected immediately after a release; a problem if it persists.
          See \`docs/guides/publishing_to_pypi.md\` §C.5 and #402.
          TOPO
          )
          fi
          GATES_SECTION=""
          if [ "$GATES_FAILED" = "true" ]; then
            GATES_SECTION=$(cat <<GATES
          ## A deploy gate failed

          \`\`\`
          ${GATES_LOG}
          \`\`\`

          These gates used to run only where someone typed \`pytest\` (C-341). Reproduce locally with:

          \`\`\`bash
          uv run pytest tests/test_falsification_deploy_v160.py tests/test_falsification_deploy_v160_r2.py
          \`\`\`

          Note the local run checks **more** than this one: the local-clone branch hygiene gate skips
          on CI by design, because a fresh runner has one local branch and would pass without
          inspecting anything.
          GATES
          )
          fi
          set -euo pipefail
          TITLE="Release hygiene: one or more deploy gates are failing"
          ORPHAN_SECTION=""
          if [ "${ORPHANS:-false}" = "true" ]; then
            ORPHAN_SECTION=$(cat <<ORPH
          ## Work may be orphaned on a merged branch

          These remote branches carry commits that are **not on \`development\`**, have **no open
          pull request**, and had a pull request that already **merged**. That is C-340 mechanism 2:
          a commit pushed to a branch after its PR merged goes nowhere, and \`git push\` reports
          success.
          ${ORPHAN_LIST}

          Recover the same way #417 did — cherry-pick onto a new branch and open a PR:

          \`\`\`bash
          git checkout -b <new-branch> origin/development
          git cherry-pick <sha>
          \`\`\`

          If the commits are genuinely unwanted, delete the branch and this closes itself.
          ORPH
          )
          fi
          BODY=$(cat <<EOF
          ${TOPOLOGY_SECTION}
          ${GATES_SECTION}
          ${ORPHAN_SECTION}

          Detected by [release-hygiene](${RUN_URL}). This issue is reused rather than duplicated,
          and closes itself once every check passes again.
          EOF
          )
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing as of $(date -u +%Y-%m-%dT%H:%MZ) — diverged=${DIVERGED}, gates_failed=${GATES_FAILED}. [run](${RUN_URL})"
            echo "Updated existing issue #${EXISTING}"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close the tracking issue if every check passes
        if: steps.check.outputs.diverged == 'false' && steps.gateresult.outputs.failed == 'false' && steps.orphans.outputs.orphans == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Both titles: the pre-2026-08-11 one so an issue opened by the
          # narrower "Release topology" workflow still closes cleanly.
          for TITLE in "Release hygiene: one or more deploy gates are failing" \
                       "main and development have diverged — back-merge needed"; do
            EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                         --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" \
                --comment "All release-hygiene checks pass again. Closed automatically."
              echo "Closed #${EXISTING}"
            fi
          done

      - name: Fail the run so the problem is visible in the Actions tab
        if: steps.check.outputs.diverged == 'true' || steps.gateresult.outputs.failed == 'true' || steps.orphans.outputs.orphans == 'true'
        run: |
          echo "::error::A release-hygiene check failed — see the tracking issue."
          exit 1
