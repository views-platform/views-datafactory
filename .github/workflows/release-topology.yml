name: Release hygiene

# Runs the deploy gates somewhere other than one operator's laptop (C-341),
# and reports out-of-band.
#
# Renamed from "Release topology" 2026-08-11 (#424). The filename is kept so
# run history, the tracking issue's provenance links and the citations in
# publishing_to_pypi.md and the register stay valid; only the remit widened.
#
# WHY THIS EXISTS
# Promoting development -> main goes through a pull request (branch protection
# allows nothing else), and a PR merge cannot fast-forward. Merge-commit is the
# only method that preserves the release SHAs, so every release leaves exactly
# one commit on main that development has not seen. The back-merge
# (publishing_to_pypi.md §C.5) heals it. Skipping it lets the branches drift
# further after each release, until `git log main..development` counts work
# that already shipped.
#
# The deploy-gate tests have always asserted this, but they could only run
# locally: the default CI checkout is shallow, so `git merge-base` cannot
# answer and they skip (C-320). Detection therefore depended on a human running
# the full suite at the right moment. After v1.10.0 that happened four hours
# late, by accident, and it had been silently true after every prior release.
#
# WHY IT IS NOT IN THE PR TEST JOB
# Deliberate. Between a release and its back-merge the branches ARE diverged —
# correctly so. Gating pull requests on it would make every PR red during that
# window for reasons unrelated to the change under review. That is exactly
# C-320: a permanently-red CI stops carrying information. Same reasoning as
# ADR-051, which chose out-of-band alerting over a merge-blocking tripwire.
#
# WHY IT OPENS AN ISSUE RATHER THAN A PR
# Actions cannot create pull requests in this repo
# (`can_approve_pull_request_reviews: false`). The alternative — a stored PAT —
# was rejected: it adds a credential with a rotation burden, days after a
# sprint spent removing exactly that (ADR-026, C-324). `issues: write` needs no
# settings change and no secret.

on:
  release:
    types: [published]
  schedule:
    # 06:00 UTC daily. Divergence is not urgent — it is a bookkeeping error,
    # not an outage — but it should not survive a working day unnoticed.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: release-topology
  cancel-in-progress: false

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # The whole point. With the default depth-1 checkout `git merge-base`
          # cannot answer and the gate skips itself into uselessness.
          fetch-depth: 0

      - name: Fetch both long-lived branches
        run: |
          git fetch --quiet origin main development

      - name: Create local main/development refs
        # Not cosmetic. `actions/checkout` leaves exactly ONE local branch, so
        # the pytest gates' bare `git merge-base --is-ancestor main development`
        # exits 128 (ref missing) and they skip themselves — even at
        # fetch-depth: 0. Measured, not assumed: rc=128 in a simulated runner
        # checkout. Two real assertions were being skipped for want of these
        # two lines, one of which (conflict-free back-merge) the shell check
        # below does not perform at all.
        run: |
          git branch -f main origin/main
          git branch -f development origin/development

      - name: Check main is an ancestor of development
        id: check
        run: |
          if git merge-base --is-ancestor origin/main origin/development; then
            echo "diverged=false" >> "$GITHUB_OUTPUT"
            echo "main is an ancestor of development — topology is clean."
          else
            echo "diverged=true" >> "$GITHUB_OUTPUT"
            {
              echo "commits=$(git rev-list --count origin/development..origin/main)"
              echo "shas<<EOF"
              git log --oneline origin/development..origin/main
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "main is NOT an ancestor of development."
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4 — pinned, NOT upgraded

      - name: Install dependencies
        run: uv sync

      - name: Run the deploy gates that can answer here
        id: gates
        continue-on-error: true
        env:
          # Lets TestF6IssueHygiene query the issue tracker instead of
          # skipping. Without it the gate reports on nothing.
          GH_TOKEN: ${{ github.token }}
          # Tells TestF8StaleBranches' LOCAL half to skip rather than pass
          # trivially — a fresh runner has one local branch, so it would
          # otherwise claim coverage it does not have.
          CI: "true"
        run: |
          set -o pipefail
          uv run pytest -rs \
            tests/test_falsification_deploy_v160.py::TestF8StaleBranches \
            tests/test_falsification_deploy_v160.py::TestF6IssueHygiene \
            tests/test_falsification_deploy_v160.py::TestF2ReleaseTopology \
            tests/test_falsification_deploy_v160_r2.py::TestDF1MergeTopology \
            2>&1 | tee gates.log
        # NOTE on what is deliberately NOT here:
        #   TestF1VersionBumped is xfail — it cannot fail a suite, so running
        #   it would add a green tick and no information. #425 owns that.
        #   TestF7ProductPlanCurrency reads only files and already runs in the
        #   normal PR suite; it needs no scheduled runner.

      - name: Summarise the gate result
        id: gateresult
        run: |
          if [ "${{ steps.gates.outcome }}" = "failure" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            {
              echo "log<<GATELOG"
              tail -40 gates.log || true
              echo "GATELOG"
            } >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the tracking issue
        if: steps.check.outputs.diverged == 'true' || steps.gateresult.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIVERGED: ${{ steps.check.outputs.diverged }}
          COMMITS: ${{ steps.check.outputs.commits }}
          SHAS: ${{ steps.check.outputs.shas }}
          GATES_FAILED: ${{ steps.gateresult.outputs.failed }}
          GATES_LOG: ${{ steps.gateresult.outputs.log }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TOPOLOGY_SECTION=""
          if [ "$DIVERGED" = "true" ]; then
            TOPOLOGY_SECTION=$(cat <<TOPO
          ## main and development have diverged

          \`main\` is not an ancestor of \`development\`: **${COMMITS} commit(s)** on \`main\` are
          missing from \`development\`.

          \`\`\`
          ${SHAS}
          \`\`\`

          Fix with the back-merge, as a **merge commit** — never a squash, which creates yet another
          commit that is not \`main\`, so this would reopen:

          \`\`\`bash
          gh pr create --base development --head main --title "chore: sync main back into development"
          \`\`\`

          Every release promotion leaves one merge commit on \`main\` that \`development\` has not
          seen. Expected immediately after a release; a problem if it persists.
          See \`docs/guides/publishing_to_pypi.md\` §C.5 and #402.
          TOPO
          )
          fi
          GATES_SECTION=""
          if [ "$GATES_FAILED" = "true" ]; then
            GATES_SECTION=$(cat <<GATES
          ## A deploy gate failed

          \`\`\`
          ${GATES_LOG}
          \`\`\`

          These gates used to run only where someone typed \`pytest\` (C-341). Reproduce locally with:

          \`\`\`bash
          uv run pytest tests/test_falsification_deploy_v160.py tests/test_falsification_deploy_v160_r2.py
          \`\`\`

          Note the local run checks **more** than this one: the local-clone branch hygiene gate skips
          on CI by design, because a fresh runner has one local branch and would pass without
          inspecting anything.
          GATES
          )
          fi
          set -euo pipefail
          TITLE="Release hygiene: one or more deploy gates are failing"
          BODY=$(cat <<EOF
          ${TOPOLOGY_SECTION}
          ${GATES_SECTION}

          Detected by [release-hygiene](${RUN_URL}). This issue is reused rather than duplicated,
          and closes itself once every check passes again.
          EOF
          )
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing as of $(date -u +%Y-%m-%dT%H:%MZ) — diverged=${DIVERGED}, gates_failed=${GATES_FAILED}. [run](${RUN_URL})"
            echo "Updated existing issue #${EXISTING}"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close the tracking issue if every check passes
        if: steps.check.outputs.diverged == 'false' && steps.gateresult.outputs.failed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Both titles: the pre-2026-08-11 one so an issue opened by the
          # narrower "Release topology" workflow still closes cleanly.
          for TITLE in "Release hygiene: one or more deploy gates are failing" \
                       "main and development have diverged — back-merge needed"; do
            EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                         --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" \
                --comment "All release-hygiene checks pass again. Closed automatically."
              echo "Closed #${EXISTING}"
            fi
          done

      - name: Fail the run so the problem is visible in the Actions tab
        if: steps.check.outputs.diverged == 'true' || steps.gateresult.outputs.failed == 'true'
        run: |
          echo "::error::A release-hygiene check failed — see the tracking issue."
          exit 1
