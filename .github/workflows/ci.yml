name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4 — pinned, NOT upgraded

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/ scripts/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4 — pinned, NOT upgraded

      - name: Install dependencies
        run: uv sync

      - name: Type check
        run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4 — pinned, NOT upgraded

      - name: Install dependencies
        run: uv sync

      - name: Test
        run: uv run pytest

  docs:
    # Documentation consistency. The script has existed since the base-docs
    # set was created and ran NOWHERE — not CI, not pytest — so it only ever
    # executed when somebody happened to type it. views-frames hit the
    # identical defect and wired theirs in (their C-74).
    #
    # Safe to make blocking, in a way the credential review-date check was
    # not (#392): this only inspects internal consistency of the docs —
    # dangling cross-references, unfilled template placeholders — all of
    # which the author of a PR can fix inside that same PR. It cannot turn
    # red because a date passed, so it cannot become the permanently-red CI
    # that C-320 warns about. No Python or uv needed; the script is bash.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Validate documentation set
        run: bash docs/validate_docs.sh

  import-enforcement:
    # Production gate — only on main branch
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4 — pinned, NOT upgraded

      - name: Install dependencies
        run: uv sync

      - name: ADR-012 import enforcement
        run: uv run pytest tests/test_import_enforcement.py -x -q
